site_name: pilot
site_description: 도메인 지식 기반 에이전트 워크플로우 플러그인
site_url: https://radiostart.github.io/claude-plugins/
repo_url: https://github.com/radiostart/claude-plugins
repo_name: radiostart/claude-plugins
edit_uri: edit/main/pilot/docs/

docs_dir: docs
site_dir: docs-site

# 영구 exclude — PLAN-manual.md 는 SDLC 메타 산출물, 사이트 콘텐츠 아님.
exclude_docs: |
  PLAN-manual.md

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)'
  - literate-nav        # reference/{agents,skills,tools}/ 를 자동 인덱싱 (docs_build.py 산출물)
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
      - Quick Start (5 분): tutorial/quick-start.md
      - Deep Walkthrough (30 분): tutorial/getting-started.md
  - How-to:
      - how-to/index.md
      - 개발 워크플로우:
          - TDD 모드 활성화: how-to/tdd-mode.md
          - Characterize 모드: how-to/characterize-mode.md
          - Critic 활용: how-to/critic-review.md
          - Focus 로 방향 조정: how-to/focus-direction.md
      - 컨텍스트 관리:
          - 기획서로 features 일괄 생성: how-to/analyze-docs.md
          - 프롬프트로 feature 단건 추가: how-to/create-feature.md
          - 외부 도메인 부트스트랩: how-to/cross-domain-learn.md
      - 운영:
          - Doctor 진단·마이그레이션: how-to/doctor-migration.md
          - Confluence 동기화: how-to/confluence-sync.md
          - Slack 알림 설정: how-to/slack-notify.md
      - 통합:
          - MOAI-ADK 연동: how-to/moai-adk-integration.md
  - Reference:
      - reference/index.md
      - Agents: reference/agents/        # literate-nav 가 디렉토리 안 .md 파일을 알파벳 순 자동 인덱싱
      - Skills: reference/skills/
      - Tools: reference/tools/
      - Identity SSOT: reference/identity.md
  - Explanation:
      - explanation/index.md
      - 핵심 개념: explanation/concepts.md
      - 에이전트 시스템:
          - 에이전트 흐름: explanation/agent-flow.md
          - Workspace 레이아웃: explanation/workspace-layout.md
      - 모드·운영:
          - 모드 - Standard / TDD / Characterize: explanation/modes.md
          - Drift Protocol: explanation/drift-protocol.md
      - SSOT·릴리스:
          - SSOT 와 derived: explanation/ssot-and-derivation.md
          - 릴리스·업그레이드: explanation/release-and-upgrade.md

extra:
  version: "0.4.0"  # docs_build.py 가 plugin.json 으로 동기화 (예정)
