site_name: pilot
site_description: 도메인 지식 기반 에이전트 워크플로우 플러그인
site_url: https://radiostart.github.io/claude-plugins/
repo_url: https://github.com/radiostart/claude-plugins
repo_name: radiostart/claude-plugins
edit_uri: edit/main/pilot/docs/

docs_dir: docs
site_dir: docs-site

# 임시 exclude — 다음 step 에서 정리·이전·nav 통합하면서 풀린다:
#   - PLAN-manual.md: SDLC 메타 산출물, 사이트 콘텐츠 아님 (영구 exclude)
#   - getting-started.md: step 6 에서 tutorial/getting-started.md 로 이전
#   - INTEGRATION-MOAI-ADK.md: step 4 에서 how-to/moai-adk-integration.md 로 이전
#   - reference/{agents,skills,tools,identity.md}: step 2 의 docs_build.py 생성물, step 3 nav 통합 시 풀림
exclude_docs: |
  PLAN-manual.md
  getting-started.md
  INTEGRATION-MOAI-ADK.md
  reference/agents/
  reference/skills/
  reference/tools/
  reference/identity.md

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)'
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
      - Quick Start (5 분): tutorial/quick-start.md
  - How-to:
      - how-to/index.md
  - Reference:
      - reference/index.md
  - Explanation:
      - explanation/index.md

extra:
  version: "0.4.0"  # docs_build.py 가 plugin.json 으로 동기화 (예정)
