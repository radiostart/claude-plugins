name: validate

# pilot 플러그인 구조 스키마 검사 (`doctor.py --schema`).
# skills/agents frontmatter · hooks.json matcher · plugin.json 필수/금지 키 ·
# SKILL description 바이트 상한 · version-git tag 일치를 검사한다.
# 근거: docs/audits/2026-07-24-pilot-consolidation-audit.md § 3 (#20 범위) —
# skills/pilot-doctor/SKILL.md 가 이미 주장하던 CI 연동을 실제로 배선.

on:
  push:
    branches: [main]
    paths:
      - 'pilot/skills/**'
      - 'pilot/agents/**'
      - 'pilot/hooks/**'
      - 'pilot/.claude-plugin/**'
      - 'pilot/tools/doctor/schema.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'pilot/skills/**'
      - 'pilot/agents/**'
      - 'pilot/hooks/**'
      - 'pilot/.claude-plugin/**'
      - 'pilot/tools/doctor/schema.py'
      - '.github/workflows/validate.yml'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 플러그인 구조 스키마 검사
        run: python3 pilot/tools/doctor.py --schema
